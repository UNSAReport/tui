name: unsareport-tui-dev

services:
  postgres-registry:
    image: postgres:16-alpine
    container_name: tui-dev-postgres-registry
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registrypassword
      POSTGRES_DB: registry_db
    volumes:
      - pgdata-registry:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:16-alpine
    container_name: tui-dev-postgres-auth
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idppassword
      POSTGRES_DB: idp_db
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idp -d idp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tui-dev-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    image: ghcr.io/unsareport/registry:latest-dev
    pull_policy: always
    container_name: tui-dev-registry
    ports:
      - "47001:3001"
    environment:
      DATABASE_URL: postgresql://registry:registrypassword@postgres-registry:5432/registry_db
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: unsareport-registry
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      IDP_ISSUER: http://auth:3000
      IDP_JWKS_URL: http://auth:3000/.well-known/jwks.json
      PORT: 3001
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      MAX_PENDING_PACKAGES: 5
    depends_on:
      postgres-registry:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  auth:
    image: ghcr.io/unsareport/auth:latest-dev
    pull_policy: always
    container_name: tui-dev-auth
    ports:
      - "47002:3000"
    environment:
      DATABASE_URL: postgresql://idp:idppassword@postgres-auth:5432/idp_db
      IDP_ISSUER: http://auth:3000
      IDP_PORT: 3000
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      IDP_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      CLIENT_REDIRECT_URL: http://localhost:3000
      ADMIN_API_KEY: admin-secret-key-12345
      ACCESS_TOKEN_TTL: 900
      REFRESH_TOKEN_TTL: 2592000
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:'+(process.env.IDP_PORT||3000)+'/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata-registry:
  pgdata-auth:
  miniodata:
